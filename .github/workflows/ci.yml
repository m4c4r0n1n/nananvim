name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run each week to find breaking changes in plugins and Neovim.
    - cron: "0 0 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job installs nananvim with install.sh, as a user does, then runs
# .github/test.sh: plugins, parsers and the smoke test.
jobs:
  linux:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch
            image: archlinux:latest
            prep: pacman -Syu --noconfirm --needed sudo git curl
          - name: Fedora
            image: fedora:latest
            prep: dnf install -y sudo git curl
          - name: Fedora 43
            image: fedora:43
            prep: dnf install -y sudo git curl
          - name: Debian
            image: debian:stable
            prep: apt-get update && apt-get install -y sudo git curl ca-certificates
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            prep: apt-get update && apt-get install -y sudo git curl ca-certificates
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            prep: apt-get update && apt-get install -y sudo git curl ca-certificates
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git and sudo
        run: ${{ matrix.prep }}
      - uses: actions/checkout@v7
      - name: Install and test
        timeout-minutes: 45
        shell: bash
        run: NANANVIM_REPO="$GITHUB_WORKSPACE" NANANVIM_REF="$GITHUB_SHA" bash .github/test.sh

  # These images cannot run GitHub actions (no glibc for node, or no node),
  # thus Docker runs them.
  docker:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NixOS (nix)
            image: nixos/nix:latest
            prep: "true"
            os: nixos
          - name: Void
            image: ghcr.io/void-linux/void-glibc-full:latest
            prep: xbps-install -Syu xbps && xbps-install -Sy bash sudo git curl
          - name: Gentoo
            image: gentoo/stage3:latest
            prep: emerge --getbinpkg --noreplace --ask=n app-admin/sudo dev-vcs/git
            volumes: --volumes-from portage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get the Gentoo package tree
        if: matrix.name == 'Gentoo'
        run: docker create -v /var/db/repos/gentoo --name portage gentoo/portage:latest /bin/true
      - name: Install and test
        timeout-minutes: 60
        run: |
          docker run --rm ${{ matrix.volumes }} \
            -v "$GITHUB_WORKSPACE:/src" \
            -e NANANVIM_REPO=/src \
            -e NANANVIM_REF="$GITHUB_SHA" \
            -e NANANVIM_OS="${{ matrix.os }}" \
            ${{ matrix.image }} sh -c '${{ matrix.prep }} && bash /src/.github/test.sh'

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install and test
        timeout-minutes: 45
        run: NANANVIM_REPO="$GITHUB_WORKSPACE" NANANVIM_REF="$GITHUB_SHA" bash .github/test.sh

  # Neovim nightly on Arch. A failure is a warning. It does not fail the workflow.
  nightly:
    name: Arch (Neovim nightly)
    runs-on: ubuntu-latest
    container: archlinux:latest
    continue-on-error: true
    env:
      NVIM_NIGHTLY: "1"
    steps:
      - name: Install git and sudo
        run: pacman -Syu --noconfirm --needed sudo git curl
      - uses: actions/checkout@v7
      - name: Install and test
        timeout-minutes: 45
        shell: bash
        run: NANANVIM_REPO="$GITHUB_WORKSPACE" NANANVIM_REF="$GITHUB_SHA" bash .github/test.sh

  # A dry run must show the steps and change nothing.
  dry-run:
    name: Installer dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dry run with an old config in place
        run: |
          mkdir -p ~/.config/nvim
          echo keep > ~/.config/nvim/init.lua
          bash install.sh --dry-run
          test "$(cat ~/.config/nvim/init.lua)" = keep
          test -z "$(ls -d ~/.config/nvim.bak.* 2>/dev/null)"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Lua format with StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ github.token }}
          version: latest
          args: --check lua/ init.lua .github/smoke.lua
      - name: Check shell scripts with ShellCheck
        run: shellcheck install.sh .github/test.sh
      - name: Check for em dashes
        run: |
          if grep -rn $'\xe2\x80\x94' --exclude-dir=.git .; then
            echo "Em dashes found. Use a comma, a colon or a period."
            exit 1
          fi
