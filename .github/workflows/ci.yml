name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run each week to find breaking changes in plugins and Neovim.
    - cron: "0 0 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        # stable is the version that users install. nightly finds breaking changes early.
        nvim-version: [stable, nightly]

    runs-on: ${{ matrix.os }}
    # A failure on nightly is a warning. It does not fail the workflow.
    continue-on-error: ${{ matrix.nvim-version == 'nightly' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find python3 nodejs npm imagemagick clang build-essential

          # Ubuntu names the fd binary fdfind.
          mkdir -p ~/.local/bin
          ln -sf "$(which fdfind)" ~/.local/bin/fd

          # nvim-treesitter (main) compiles parsers with the tree-sitter CLI.
          curl -fsSL -o /tmp/tree-sitter.gz https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-linux-x64.gz
          gunzip -f /tmp/tree-sitter.gz
          install -m 755 /tmp/tree-sitter ~/.local/bin/tree-sitter
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Link config
        run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim

      - name: Install plugins
        timeout-minutes: 10
        run: nvim --headless "+Lazy! restore" +qa

      - name: Install treesitter parsers
        timeout-minutes: 15
        run: |
          nvim --headless -c 'lua
            local spec = require("lazy.core.config").plugins["nvim-treesitter"]
            local opts = require("lazy.core.plugin").values(spec, "opts", false)
            require("nvim-treesitter").install(opts.ensure_installed):wait(900000)' -c qa

      - name: Smoke test
        timeout-minutes: 5
        # "shell: bash" sets pipefail, thus a failed test is not hidden by tee.
        shell: bash
        run: nvim --headless -c "luafile .github/smoke.lua" 2>&1 | tee smoke.log

      - name: Health check
        if: always()
        run: |
          nvim --headless "+checkhealth" "+w! health.log" +qa || true
          cat health.log || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.os }}-${{ matrix.nvim-version }}
          path: |
            health.log
            smoke.log

  test-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install neovim ripgrep fd node python3 imagemagick tree-sitter-cli

      - name: Link config
        run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim

      - name: Install plugins
        timeout-minutes: 10
        run: nvim --headless "+Lazy! restore" +qa

      - name: Smoke test
        timeout-minutes: 5
        run: nvim --headless -c "luafile .github/smoke.lua"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check Lua format with StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ github.token }}
          version: latest
          args: --check lua/ init.lua .github/smoke.lua

      - name: Check install.sh with ShellCheck
        run: shellcheck install.sh

      - name: Check for em dashes
        run: |
          if grep -rn $'\xe2\x80\x94' --exclude-dir=.git .; then
            echo "Em dashes found. Use a comma, a colon or a period."
            exit 1
          fi
